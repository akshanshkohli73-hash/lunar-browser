name: Verify Lunar Browser
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer-and-regressions:
    name: Renderer, types and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: chromium-renderer-evidence
          path: .artifacts/ui/
          if-no-files-found: ignore
  windows-native-and-installer:
    name: Windows native browser and NSIS
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install pinned Electron runtime
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          npm run install:electron 2>&1 | Tee-Object -Variable runtimeOutput
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (($runtimeOutput | Select-Object -Last 60) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Electron runtime installation failed::$detail"
          }
          exit $code
      - run: npm run check
      - name: Real Electron integration (no fake bridge or iframe)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          npm run test:native 2>&1 | Tee-Object -Variable nativeOutput
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (($nativeOutput | Select-Object -Last 60) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native Electron integration failed::$detail"
          }
          exit $code
      - name: Package unsigned Windows x64 installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          npm run dist:win 2>&1 | Tee-Object -Variable packageOutput
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (($packageOutput | Select-Object -Last 100) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer packaging failed::$detail"
          }
          exit $code
      - name: Verify packaged Windows application and video wallpaper
        shell: pwsh
        run: |
          $env:LUNAR_PACKAGED_EXECUTABLE = (Resolve-Path "release/win-unpacked/Lunar Browser.exe").Path
          $PSNativeCommandUseErrorActionPreference = $false
          npm run test:native 2>&1 | Tee-Object -Variable packagedOutput
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (($packagedOutput | Select-Object -Last 80) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Packaged Windows integration failed::$detail"
          }
          exit $code
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-material-evidence
          path: .artifacts/native-ui/
          if-no-files-found: ignore
      - name: Hash produced installers
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release/*.exe -ErrorAction Stop)
          if ($installers.Count -eq 0) { throw "No installer was produced" }
          $hashes = @($installers | Get-FileHash -Algorithm SHA256)
          $hashes | Format-List | Out-File release/SHA256.txt
          foreach ($entry in $hashes) {
            $name = Split-Path $entry.Path -Leaf
            Write-Output "::notice title=Windows installer SHA256::$name $($entry.Hash)"
            $signature = Get-AuthenticodeSignature $entry.Path
            Write-Output "::notice title=Windows installer Authenticode::$name $($signature.Status)"
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lunar-windows-x64-unsigned
          path: |
            release/*.exe
            release/SHA256.txt
          if-no-files-found: error

  stage-verified-2-4-1-release:
    name: Stage verified 2.4.1 assets in existing draft (one-time opt-in)
    # This job cannot publish. Only this explicit commit marker stages fixed,
    # previously verified bytes in an existing empty draft. Remove after use.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'akshanshkohli73-hash/lunar-browser' &&
      github.ref == 'refs/heads/arena/8b00471f-lunar-browser' &&
      contains(github.event.head_commit.message, '[stage-release-v2.4.1]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check provenance, stage unchanged installer and verify round-trip
        shell: bash
        run: |
          set -euo pipefail
          tag=v2.4.1
          source=e60fdf2ad1719f23da18850e2ef96c124db72709
          source_run=42600154938
          artifact_id=13665926660
          archive_hash=2b61ca2d282035025714e5a4c9efd57a088172c6ba78e67671b60e159d46a293
          expected=d695343e49323b1950bc979a4879a57c95ae47d452f86d71e55da1f36dac51f6
          installer=Lunar-Browser-2.4.1-win-x64.exe

          run_json=$(gh api "repos/$GH_REPO/actions/runs/$source_run")
          jq -e --arg source "$source" --arg repo "$GH_REPO" '
            .status == "completed" and .conclusion == "success" and
            .head_sha == $source and .head_repository.full_name == $repo and
            .head_branch == "arena/8b00471f-lunar-browser" and
            .event == "push" and .path == ".github/workflows/verify.yml"
          ' <<< "$run_json"
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$source_run/jobs?per_page=100")
          jq -e '
            ([.jobs[] | select(.name == "Renderer, types and regression tests" and .conclusion == "success")] | length) == 1 and
            ([.jobs[] | select(.name == "Windows native browser and NSIS" and .conclusion == "success") |
              .steps[] | select(.conclusion == "success" and
                (.name == "Real Electron integration (no fake bridge or iframe)" or
                 .name == "Package unsigned Windows x64 installer" or
                 .name == "Verify packaged Windows application and video wallpaper"))] | length) == 3
          ' <<< "$jobs"

          artifact=$(gh api "repos/$GH_REPO/actions/artifacts/$artifact_id")
          jq -e --arg digest "sha256:$archive_hash" --arg source "$source" --argjson run "$source_run" '
            .expired == false and .name == "lunar-windows-x64-unsigned" and
            .digest == $digest and .workflow_run.id == $run and
            .workflow_run.head_sha == $source and .size_in_bytes == 113741083
          ' <<< "$artifact"
          release=$(gh release view "$tag" --json isDraft,isPrerelease,targetCommitish,assets)
          jq -e --arg source "$source" '
            .isDraft == true and .isPrerelease == true and
            .targetCommitish == $source and (.assets | length) == 0
          ' <<< "$release"

          mkdir -p .artifacts/release-stage-2.4.1 .artifacts/release-roundtrip-2.4.1
          archive=.artifacts/release-stage-2.4.1/verified-artifact.zip
          gh api "repos/$GH_REPO/actions/artifacts/$artifact_id/zip" > "$archive"
          printf '%s  %s\n' "$archive_hash" "$archive" | sha256sum --check --strict
          # The pinned archive has exactly these two files. Reject unexpected
          # paths rather than extracting arbitrary archive entries.
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          stage = Path('.artifacts/release-stage-2.4.1')
          with zipfile.ZipFile(stage / 'verified-artifact.zip') as archive:
              assert sorted(archive.namelist()) == ['Lunar-Browser-2.4.1-win-x64.exe', 'SHA256.txt']
              archive.extractall(stage)
          PY
          staged=".artifacts/release-stage-2.4.1/$installer"
          printf '%s  %s\n' "$expected" "$staged" | sha256sum --check --strict
          printf '%s  %s\n' "$expected" "$installer" > .artifacts/release-stage-2.4.1/SHA256SUMS.txt
          gh release upload "$tag" "$staged" .artifacts/release-stage-2.4.1/SHA256SUMS.txt

          # Verify both uploaded assets by downloading them again before the
          # separate human-authorized publication operation.
          gh release download "$tag" --pattern "$installer" --pattern SHA256SUMS.txt --dir .artifacts/release-roundtrip-2.4.1
          cmp .artifacts/release-stage-2.4.1/SHA256SUMS.txt .artifacts/release-roundtrip-2.4.1/SHA256SUMS.txt
          (cd .artifacts/release-roundtrip-2.4.1 && sha256sum --check --strict SHA256SUMS.txt)
          gh release view "$tag" --json isDraft,isPrerelease,targetCommitish,assets --jq '{isDraft,isPrerelease,targetCommitish,assets:[.assets[]|{name,size,state}]}'
          {
            echo '## Verified 2.4.1 assets staged — still a draft, not public'
            echo "Source: $source · successful verification: $source_run · artifact: $artifact_id"
            echo "Archive SHA-256: $archive_hash"
            echo "Installer SHA-256: $expected"
            echo 'Original archive, extracted installer, and release round-trip checks passed.'
            echo 'Explicit gh release edit --draft=false is still required. No public publisher or signing was added.'
          } >> "$GITHUB_STEP_SUMMARY"
